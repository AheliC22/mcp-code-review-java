server.port=${SERVER_PORT:8080}

spring.application.name=mcp-code-review

github.token=${GITHUB_TOKEN:}
github.repo.owner=${GITHUB_REPO_OWNER:}
github.repo.name=${GITHUB_REPO_NAME:}
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}

docs.path=docs/

logging.level.root=INFO
logging.level.com.mcp.assignment=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n